name: wear-ci
on:
  push:
    paths: ["wear-app/**", ".github/workflows/wear-ci.yml"]
  pull_request:
    paths: ["wear-app/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle lint testDebugUnitTest assembleDebug
